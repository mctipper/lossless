<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lossless {game}</title>
    <link rel="stylesheet" href="shared/assets/styles.css">

    <!-- Fonts: pixel eyebrow tag + grotesk display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>

<body>
    <header class="game-header">
        <div class="game-header__frame">
            <span class="game-header__eyebrow">Futile Attempts</span>
            <h1 class="game-header__title">Lossless {game}</h1>
            <p class="game-header__subtitle">Publically documenting the shame of our struggles in completing the below games in full without losing a single life. Assisted by <span class="info-tooltip" data-tooltip="XXXX Gold Longneck with a Negroni dropped into it">Negroni-Bombs</span>.</p>
            <p class="game-header__meta">We're not very good.</p>
        </div>
    </header>
    <div class="container">
        <div class="landing-card-grid">
            <a class="landing-card" data-game="dkc2" href="game.html#dkc2">
                <h2>Donkey Kong Country 2</h2>
                <div class="basic-stats"></div>
            </a>
            <a class="landing-card" data-game="smw" href="game.html#smw">
                <h2>Super Mario World</h2>
                <div class="basic-stats"></div>
            </a>
            <a class="landing-card" data-game="smb3" href="game.html#smb3">
                <h2>Super Mario Bros. 3</h2>
                <div class="basic-stats"></div>
            </a>
            <a class="landing-card" data-game="smb" href="game.html#smb">
                <h2>Super Mario Bros.</h2>
                <div class="basic-stats"></div>
            </a>
        </div>
    </div>

    <script type="module" src="shared/js/landing.js"></script>
</body>

</html>
